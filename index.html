<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var savedScheme = localStorage.getItem('color-scheme');
        if (savedScheme === 'light' || savedScheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = savedScheme;
        }
        if (localStorage.getItem('ekonomia-font-scale') === 'large') {
          document.documentElement.dataset.fontScale = 'large';
        }
      } catch (e) {}
    </script>
    <title>Ekonomia — Kompendium Studenta i Strefa Kolokwium</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233730A3'/%3E%3Cpath d='M7 22L13 15L18 19L25 10' fill='none' stroke='%23FAF9F6' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='10' r='2.4' fill='%232DD4BF'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Interaktywne kompendium z mikroekonomii i makroekonomii: wykłady, wykresy SVG, ćwiczenia krok po kroku, strefa kolokwium oraz ściąga ze wzorami i definicjami."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
